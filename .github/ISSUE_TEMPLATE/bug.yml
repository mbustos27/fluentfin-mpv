name: Report a problem
description: Something in Nixie doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Say what happened and how to make it happen again. The fields below ask for everything needed to look into it.

        **Never paste a server address, username or token.** None of it is needed, and this page is public.

  - type: input
    id: version
    attributes:
      label: Nixie version
      description: Settings → About shows it.
      placeholder: "1.7.0"
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Settings → Appearance → Theme.
      options:
        - Drive-in
        - Cinematic
        - Editorial
        - Classic
        - It happens in all of them
    validations:
      required: true

  - type: dropdown
    id: colours
    attributes:
      label: Dark, light or high contrast
      description: Nixie follows Windows' colour mode (Settings → Personalization → Colors).
      options:
        - Dark
        - Light
        - A high-contrast theme
    validations:
      required: false

  - type: dropdown
    id: glass
    attributes:
      label: Glass
      description: Settings → Appearance → Glass.
      options:
        - Automatic
        - Full
        - Reduced
        - Solid
    validations:
      required: false

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings → System → About, under Windows specifications.
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
      description: |
        The server's version number only, not its address. Jellyfin's Dashboard shows it; leave this blank if you don't know it.
      placeholder: "10.11.3"
    validations:
      required: false

  - type: dropdown
    id: install
    attributes:
      label: How you run Nixie
      options:
        - Installer (.msi)
        - Portable (.zip)
        - Built from source
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      multiple: true
      options:
        - Signing in
        - Home
        - A library, collection or playlist
        - A film, series, season or episode page
        - Playing video
        - Search
        - Settings
        - Diary
        - Updates
        - Somewhere else
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: |
        What you saw, and what you expected instead. A screenshot helps: drop it in here, with server names and addresses cropped out.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The shortest way there from opening Nixie, and whether it happens every time or only sometimes.
      placeholder: |
        1. Open a series and choose season 2.
        2. Press Play on episode 3.
        3. Press Space before clicking the video.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: |
        Paste `%LOCALAPPDATA%\Nixie\Logs` into File Explorer's address bar. `log<date>.txt` is the app's log and `mpv-backend.log` is playback's. For a problem with an update, copy the lines that start with `[update]` from the newest `log<date>.txt`. Paste only the lines around the problem. Tokens are already removed, but a log can still show your server's address: read the lines first, and never paste a server address, username or token.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send it
      options:
        - label: This report has no server address, username, password or token in it.
          required: true
